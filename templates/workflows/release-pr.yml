# Managed by dev-bot (https://github.com/agusheryanto182/dev-bot). Re-run setup-repo.sh to update.
name: Release PR

on:
  schedule:
    - cron: '0 10 * * *' # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    uses: __DEV_BOT__/.github/workflows/release-pr.yml@__REF__
    with:
      runner: '__RUNNER__'
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
