# Managed by dev-bot (https://github.com/agusheryanto182/dev-bot). Re-run setup-repo.sh to update.
name: CI Autofix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  autofix:
    uses: __DEV_BOT__/.github/workflows/ci-autofix.yml@__REF__
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      runner: '__RUNNER__'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
